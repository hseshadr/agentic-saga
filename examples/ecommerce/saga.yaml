schema_version: "1.0"
name: ecommerce_checkout
version: "1.0"
objective: Complete order order_demo_001 for customer_demo_001 with sku_travel_pack quantity 1 at USD 79.00, or restore a verified safe state.
instructions:
  - Use only the currently advertised forward tool and the exact public order values in the objective.
  - Choose one tool at a time and reassess the public evidence after every result.
  - Finish only when the Workflow advertises succeeded_verified as an allowed target.
  - Never request compensation or human escalation; the deterministic Workflow owns both decisions.
success_criteria:
  - Inventory is reserved, payment is captured, fulfillment is scheduled, and verify_order returns verified true.
autonomy:
  mode: guarded
  instructions:
    - Propose forward work within the fixed budgets; do not invent provider state.
budgets:
  turn_limit: 6
  tool_call_limit: 4
  elapsed_ms_limit: 180000
  token_limit: 6000
tools:
  catalog_sha256: "9ac3dd064e8ff61764cf3bbf5cc67886e5f85ae3b9927aff974d07f50960fb22"
  allowed:
    - reserve_inventory
    - charge_payment
    - schedule_fulfillment
    - verify_order
checks:
  policy: []
  success:
    - order_verified
  compensation:
    - obligations_reversed
  clean_abort:
    - no_external_effects
escalation:
  conditions:
    - A compensation outcome remains unresolved after its safe Activity attempts.
  instructions:
    - Pause before later compensation and require trusted external authorization evidence.
example_paths:
  - name: checkout succeeds
    kind: happy_path
    narrative:
      - Reserve inventory, charge payment, and schedule fulfillment only as each tool becomes eligible.
      - Call verify_order for fresh authoritative proof, then finish as succeeded_verified.
  - name: fulfillment is rejected
    kind: compensation_path
    narrative:
      - If verify_order returns verified false, stop forward planning.
      - The Workflow derives cancel_fulfillment, refund_payment, and release_inventory from confirmed receipts; the agent does not order them.
  - name: refund response is unresolved
    kind: compensation_path
    narrative:
      - The Workflow pauses before releasing inventory and resumes only after its verifier accepts an opaque authorization reference.
