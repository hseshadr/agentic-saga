name: Dagger security audit
on: {schedule: [{cron: "17 8 * * 1"}], workflow_dispatch: null}
permissions: {contents: read}
concurrency:
  group: dagger-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dagger:
    name: Dagger security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      # dagger-for-github pastes args into bash, so the auth decision arrives as the
      # USE_GIT_AUTH env var and args only test whether it is set: bash can add the
      # fixed auth flag or nothing, and never runs event text.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          DAGGER_GIT_HTTP_AUTH_HEADER: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DAGGER_GIT_HTTP_AUTH_HEADER != '' && secrets.DAGGER_GIT_HTTP_AUTH_HEADER || '' }}
          USE_GIT_AUTH: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DAGGER_GIT_HTTP_AUTH_HEADER != '' && 'true' || '' }}
        with:
          version: "0.21.8"
          verb: call
          args: >-
            security --commit-sha=${{ github.sha }} ${USE_GIT_AUTH:+--git-auth-header=env:DAGGER_GIT_HTTP_AUTH_HEADER}
