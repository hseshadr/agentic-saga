name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # Reusable checks read pull-request metadata.

jobs:
  frontend:
    name: Flight Recorder gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-pnpm@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
        with:
          working-directory: web/flight-recorder
          package-json-file: web/flight-recorder/package.json
          cache-dependency-path: web/flight-recorder/pnpm-lock.yaml
          node-version: "24"
          install-args: "--frozen-lockfile"
      - name: Install Chromium and its operating-system dependencies
        working-directory: web/flight-recorder
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the complete Flight Recorder gate
        working-directory: web/flight-recorder
        run: pnpm gate

  python:
    name: Python gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    uses: hseshadr/ci/.github/workflows/python-gate.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
    with:
      python-version: ${{ matrix.python-version }}
      sync-args: "--frozen --group dev"

  packaged-demo:
    name: Packaged Flight Recorder
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-python-uv@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
        with:
          python-version: ${{ matrix.python-version }}
          sync-args: "--frozen --group dev"
      - uses: hseshadr/ci/.github/actions/setup-pnpm@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
        with:
          working-directory: web/flight-recorder
          package-json-file: web/flight-recorder/package.json
          cache-dependency-path: web/flight-recorder/pnpm-lock.yaml
          node-version: "24"
          install-args: "--frozen-lockfile"
      - name: Install Chromium and its operating-system dependencies
        working-directory: web/flight-recorder
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and install the wheel
        env:
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
        run: |
          UV_OFFLINE=0 uv run poe artifacts
          uv venv --offline --no-python-downloads --python ${{ matrix.python-version }} .venv-package
          uv pip install --offline --no-python-downloads --no-index --find-links dist/release/wheelhouse --python .venv-package/bin/python --require-hashes -r dist/release/runtime-requirements.txt
          uv pip install --offline --no-python-downloads --python .venv-package/bin/python --no-deps dist/release/*.whl
          uv pip check --offline --no-python-downloads --python .venv-package/bin/python
      - name: Exercise the wheel-installed recorder in Chromium
        working-directory: web/flight-recorder
        env:
          AGENTIC_SAGA_CLI: ${{ github.workspace }}/.venv-package/bin/agentic-saga
          npm_config_offline: "true"
        run: pnpm test:e2e:packaged
      - name: Enforce offline release budgets
        env:
          AGENTIC_SAGA_CLI: ${{ github.workspace }}/.venv-package/bin/agentic-saga
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          npm_config_offline: "true"
        run: uv run python scripts/measure_release.py

  secrets:
    name: Secret scan
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
