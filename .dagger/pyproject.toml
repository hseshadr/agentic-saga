[project]
name = "agentic-saga-ci"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["dagger-io"]

[project.entry-points."dagger.mod"]
main_object = "agentic_saga_ci:AgenticSaga"

[dependency-groups]
dev = ["mypy", "pip-audit", "poethepoet", "pytest", "pytest-cov", "ruff", "xenon"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[tool.dagger]
base-image = "python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6"

[tool.poe.tasks]
fmt = "ruff format src tests"
lint = { shell = "ruff check src tests && ruff format --check src tests" }
typecheck = "mypy --strict src"
complexity = "xenon --max-absolute A --max-modules A --max-average A src"
test = "pytest --cov=src/agentic_saga_ci --cov-branch --cov-fail-under=90"
audit = "pip-audit"
gate = ["lint", "typecheck", "complexity", "test"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
